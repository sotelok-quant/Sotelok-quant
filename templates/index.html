<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOTELOK // SHARP TERMINAL</title>
    <style>
        :root {
            --bg-dark: #0a0d14;
            --panel-bg: #121824;
            --card-bg: #1a2233;
            --accent-cyan: #00f2fe;
            --accent-green: #00ff87;
            --accent-purple: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #8e9bb0;
            --border-color: #2a354d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .terminal-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header-title {
            text-align: center;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            font-size: 1.2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .form-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        select, input {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-cyan);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-analyze {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
            margin-top: 5px;
        }

        .btn-analyze:active {
            transform: scale(0.98);
        }

        /* RESULTADOS Y PESTAÑAS estilo Flashscore */
        .results-panel {
            display: none;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            flex-direction: column;
            gap: 15px;
        }

        .match-header {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .prob-bar-container {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .prob-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .prob-val {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-cyan);
        }

        .prob-lbl {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* NAVEGACIÓN POR PESTAÑAS */
        .tab-nav {
            display: flex;
            gap: 5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--accent-cyan);
            border-bottom: 2px solid var(--accent-cyan);
        }

        /* TARJETAS DE ESCENARIOS */
        .scenario-box {
            background: var(--card-bg);
            border-left: 4px solid var(--accent-cyan);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .scenario-box.alt {
            border-left-color: var(--accent-green);
        }

        .scenario-tag {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
        }

        .scenario-box.alt .scenario-tag {
            color: var(--accent-green);
        }

        .scenario-heading {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .scenario-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .loading-text {
            display: none;
            text-align: center;
            font-size: 0.8rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="header-title">SOTELOK // SHARP TERMINAL</div>

    <div class="form-panel">
        <div class="input-group">
            <label for="deporte">Deporte / Disciplina</label>
            <select id="deporte">
                <option value="futbol_secundaria">Fútbol (Ligas Secundarias / General)</option>
                <option value="beisbol_mlb">Béisbol (MLB / Ligas)</option>
                <option value="baloncesto_nba">Baloncesto (NBA / Ligas)</option>
            </select>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label for="local">Equipo Local</label>
                <input type="text" id="local" placeholder="Ej. Real Sociedad">
            </div>
            <div class="input-group">
                <label for="visitante">Equipo Visitante</label>
                <input type="text" id="visitante" placeholder="Ej. Lyon">
            </div>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label for="xg_local">Métrica Local (xG/Carreras/Pts)</label>
                <input type="number" step="0.01" id="xg_local" value="1.85">
            </div>
            <div class="input-group">
                <label for="xg_visitante">Métrica Visitante (xG/Carreras/Pts)</label>
                <input type="number" step="0.01" id="xg_visitante" value="1.10">
            </div>
        </div>

        <div class="input-group">
            <label for="cuota">Cuota Bookmaker (Línea)</label>
            <input type="number" step="0.01" id="cuota" value="1.95">
        </div>

        <button class="btn-analyze" onclick="procesarAnalisis()">Activar Análisis Sharp Fortress</button>
        <div class="loading-text" id="loading">EJECUTANDO MODELO ESTOCÁSTICO Y CONSULTA BD...</div>
    </div>

    <!-- RESULTADOS DINÁMICOS -->
    <div class="results-panel" id="results-panel">
        <div class="match-header" id="match-title">Partido vs Partido</div>

        <div class="prob-bar-container" id="prob-container">
            <div class="prob-item">
                <span class="prob-lbl">PROB. LOCAL</span>
                <span class="prob-val" id="prob-local">0%</span>
            </div>
            <div class="prob-item" id="draw-item">
                <span class="prob-lbl">EMPATE</span>
                <span class="prob-val" id="prob-draw">0%</span>
            </div>
            <div class="prob-item">
                <span class="prob-lbl">PROB. VISITANTE</span>
                <span class="prob-val" id="prob-away">0%</span>
            </div>
        </div>

        <!-- NAVEGACIÓN ESTILO FLASHSCORE -->
        <div class="tab-nav">
            <button class="tab-btn active">ANALISIS SHARP</button>
            <button class="tab-btn">GOLES / TOTALES</button>
            <button class="tab-btn">CÓRNERS / CUARTOS</button>
            <button class="tab-btn">TARJETAS / LÍNEAS</button>
        </div>

        <div id="escenarios-container" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- Escenarios inyectados vía JS -->
        </div>
    </div>
</div>

<script>
    function procesarAnalisis() {
        const deporteSelect = document.getElementById('deporte').value;
        const localVal = document.getElementById('local').value || "Equipo Local";
        const visitanteVal = document.getElementById('visitante').value || "Equipo Visitante";
        const xgLocalVal = document.getElementById('xg_local').value;
        const xgVisitanteVal = document.getElementById('xg_visitante').value;
        const cuotaVal = document.getElementById('cuota').value;

        document.getElementById('loading').style.display = 'block';
        document.getElementById('results-panel').style.display = 'none';

        fetch('/analizar_sharp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                deporte: deporteSelect,
                local: localVal,
                visitante: visitanteVal,
                xG_local: xgLocalVal,
                xG_visitante: xgVisitanteVal,
                cuota: cuotaVal
            })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('loading').style.display = 'none';

            if (data.status === 'success') {
                document.getElementById('results-panel').style.display = 'flex';
                document.getElementById('match-title').innerText = data.partido;

                document.getElementById('prob-local').innerText = data.probabilidades.local + '%';
                document.getElementById('prob-draw').innerText = data.probabilidades.empate + '%';
                document.getElementById('prob-away').innerText = data.probabilidades.visitante + '%';

                // Ocultar fila de empate si es Baloncesto
                if (deporteSelect.includes('basket') || deporteSelect.includes('nba')) {
                    document.getElementById('draw-item').style.display = 'none';
                } else {
                    document.getElementById('draw-item').style.display = 'flex';
                }

                let htmlEscenarios = '';
                data.escenarios_estrategicos.forEach((esc, index) => {
                    const altClass = index > 0 ? 'alt' : '';
                    htmlEscenarios += `
                        <div class="scenario-box ${altClass}">
                            <div class="scenario-tag">${esc.rango}</div>
                            <div class="scenario-heading">${esc.titulo}</div>
                            <div class="scenario-desc">${esc.analisis}</div>
                        </div>
                    `;
                });

                document.getElementById('escenarios-container').innerHTML = htmlEscenarios;
            } else {
                alert("Error en el motor: " + data.message);
            }
        })
        .catch(error => {
            document.getElementById('loading').style.display = 'none';
            alert("Error de conexión con la terminal: " + error);
        });
    }
</script>

</body>
</html>
